<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <!--     <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&Ubuntu+Mono&display=swap" rel="stylesheet"> -->
    <title>Calculator</title>
  </head>
  <body>
    <div class="container">
      <div class="project-title">
        <h1>tom's calculator</h1>
      </div>
      <div class="screen-container">
        <input type="text" class="screen" id="screen-top" readonly />
        <input type="text" class="screen" id="screen-bottom" readonly />
      </div>
      <div class="buttons-container">
        <button id="clear" data-key="Escape">C</button>
        <button id="dark">Dark</button>
        <button id="OldSkool"></button>
        <button class="operator" data-key="/">/</button>
        <button class="digit" data-key="7">7</button>
        <button class="digit" data-key="8">8</button>
        <button class="digit" data-key="9">9</button>
        <button class="operator" data-key="x">x</button>
        <button class="digit" data-key="4">4</button>
        <button class="digit" data-key="5">5</button>
        <button class="digit" data-key="6">6</button>
        <button class="operator" data-key="-">-</button>
        <button class="digit" data-key="1">1</button>
        <button class="digit" data-key="2">2</button>
        <button class="digit" data-key="3">3</button>
        <button class="operator" data-key="+">+</button>
        <button class="digit" data-key="0">0</button>
        <button class="digit" id="dot" data-key=".">.</button>
        <button id="equals" data-key="Enter">=</button>
        <button id="backspace" data-key="Backspace">back</button>
      </div>
    </div>
    <script src="script.js"></script>
    <a
      href="https://github.com/brrrrdy/Calculator"
      target="_blank"
      class="github-fab"
      aria-label="View on GitHub"
    >
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
        <path
          d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
        />
      </svg>
    </a>
    <div class="footer">
      <p>
        Built by<a href="https://github.com/brrrrdy/Calculator" target="_blank"
          >Tom Alvarez as part of the Odin Project 2025</a
        >
      </p>
    </div>
  </body>
</html>
